<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SubStore logo">
  <defs>
    <linearGradient id="substoreMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile; everything outside the corner radius stays transparent,
       which is what lets it sit on both the light and the dark navbar. -->
